name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (vendored core included)
        run: npm install --no-audit --no-fund
      - name: Tests + build + dist guards
        run: npm run verify
