name: Release

# Builds the plugin from the tagged source and publishes the three assets the
# community directory installs (main.js, manifest.json, styles.css).
#
# Why CI owns the assets (plan 101):
#   • the directory rebuilds the tagged source and byte-compares it with the
#     released main.js — a local build with a different Node/dependency tree
#     fails that check, so the release has to come from a pinned CI runner;
#   • artifact attestations ("Missing GitHub artifact attestations") can only
#     be produced by a trusted workflow.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (vendored core included)
        run: npm ci --no-audit --no-fund

      - name: Tag must match manifest.json
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $manifest"
            exit 1
          fi

      - name: Lint + tests + build + dist guards
        run: npm run verify

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            main.js manifest.json styles.css
